name: Docker ludo Image

on:
  push:
    branches: ["main"]

jobs:
  publish_images:
    name: Build & Push Image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ludo:latest

  deploy-to-ec2:
    name: Deploy to EC2
    needs: publish_images
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Redeploy Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ludo:latest
            docker stop ludo-app || true
            docker rm ludo-app || true
            docker run -d --name ludo-app --restart always -p 80:3000 ${{ secrets.DOCKERHUB_USERNAME }}/ludo:latest
            docker image prune -f
